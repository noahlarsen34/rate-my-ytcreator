<svg xmlns="http://www.w3.org/2000/svg" width="2000" height="1200" viewBox="0 0 2000 1200">
<defs><pattern id="g" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#e9edf0"/></pattern><marker id="a" markerWidth="12" markerHeight="12" refX="10" refY="6" orient="auto"><path d="M0 0L12 6L0 12Z" fill="#46545e"/></marker><filter id="s"><feDropShadow dx="0" dy="3" stdDeviation="4" flood-opacity=".12"/></filter><style>.title{font:700 40px Arial;fill:#202d35}.sub{font:20px Arial;fill:#68747c}.boundary{fill:#fff;fill-opacity:.72;stroke:#66747d;stroke-width:3}.node{stroke:#46545e;stroke-width:3;filter:url(#s)}.entity{fill:#cfe2fb}.process{fill:#f7cdcf}.store{fill:#fff0b9}.et{font:700 24px Arial;fill:#26343d;text-anchor:middle}.pt{font:700 21px Arial;fill:#26343d;text-anchor:middle}.dt{font:700 22px Arial;fill:#26343d;text-anchor:middle}.ds{font:17px Arial;fill:#46545e;text-anchor:middle}.flow,.response{fill:none;stroke:#46545e;stroke-width:3;marker-end:url(#a)}.response{stroke-dasharray:7 7}.label{font:16px Arial;fill:#26343d;text-anchor:middle}.pill{fill:#fff;stroke:#d8dee2}.legend{font:15px Arial;fill:#26343d}</style></defs>
<rect width="2000" height="1200" fill="white"/><rect x="20" y="20" width="1960" height="1160" rx="24" fill="url(#g)" stroke="#26343d" stroke-width="3"/>
<text x="65" y="72" class="title">Rate My Creator — Logical Level 1 Data Flow Diagram</text><text x="65" y="106" class="sub">One database, four main processes, and two external services</text>
<!-- legend --><g transform="translate(1270 42)"><rect width="650" height="85" rx="12" fill="white" stroke="#cfd6da" stroke-width="2"/><rect x="18" y="19" width="110" height="46" rx="7" class="node process"/><text x="73" y="48" class="legend" text-anchor="middle">Process</text><rect x="150" y="19" width="130" height="46" rx="7" class="node entity"/><text x="215" y="48" class="legend" text-anchor="middle">External entity</text><path d="M305 30C305 22 333 17 370 17S435 22 435 30V55C435 63 407 68 370 68S305 63 305 55Z" class="node store"/><ellipse cx="370" cy="30" rx="65" ry="13" fill="#fff5cc" stroke="#46545e" stroke-width="3"/><text x="370" y="51" class="legend" text-anchor="middle">Data store</text><path d="M465 31H555" class="flow"/><text x="510" y="18" class="legend" text-anchor="middle">Request</text><path d="M555 59H630" class="response"/><text x="592" y="45" class="legend" text-anchor="middle">Response</text></g>
<!-- boundary and entities --><rect x="350" y="165" width="1240" height="920" rx="18" class="boundary"/><rect x="390" y="144" width="310" height="43" rx="6" fill="#46545e"/><text x="545" y="173" font="700 20px Arial" fill="white" text-anchor="middle">RATE MY CREATOR PLATFORM</text><rect x="55" y="535" width="225" height="125" rx="12" class="node entity"/><text x="167" y="606" class="et">User</text><rect x="1680" y="235" width="245" height="110" rx="12" class="node entity"/><text x="1802" y="281" class="et"><tspan x="1802">Google OAuth</tspan><tspan x="1802" dy="30">Service</tspan></text><rect x="1680" y="870" width="245" height="110" rx="12" class="node entity"/><text x="1802" y="934" class="et">YouTube</text>
<!-- processes --><g><rect x="430" y="230" width="325" height="115" rx="10" class="node process"/><line x1="458" y1="230" x2="458" y2="345" stroke="#46545e" stroke-width="3"/><line x1="727" y1="230" x2="727" y2="345" stroke="#46545e" stroke-width="3"/><text x="592" y="275" class="pt"><tspan x="592">1.0 Sign In and</tspan><tspan x="592" dy="29">Manage Profile</tspan></text></g><g><rect x="430" y="420" width="325" height="115" rx="10" class="node process"/><line x1="458" y1="420" x2="458" y2="535" stroke="#46545e" stroke-width="3"/><line x1="727" y1="420" x2="727" y2="535" stroke="#46545e" stroke-width="3"/><text x="592" y="465" class="pt"><tspan x="592">2.0 Search and Display</tspan><tspan x="592" dy="29">Creator Information</tspan></text></g><g><rect x="430" y="610" width="325" height="115" rx="10" class="node process"/><line x1="458" y1="610" x2="458" y2="725" stroke="#46545e" stroke-width="3"/><line x1="727" y1="610" x2="727" y2="725" stroke="#46545e" stroke-width="3"/><text x="592" y="655" class="pt"><tspan x="592">3.0 Submit Reviews</tspan><tspan x="592" dy="29">and Review Votes</tspan></text></g><g><rect x="430" y="800" width="325" height="115" rx="10" class="node process"/><line x1="458" y1="800" x2="458" y2="915" stroke="#46545e" stroke-width="3"/><line x1="727" y1="800" x2="727" y2="915" stroke="#46545e" stroke-width="3"/><text x="592" y="830" class="pt"><tspan x="592">4.0 Manage Follows</tspan><tspan x="592" dy="28">and Import YouTube</tspan><tspan x="592" dy="28">Subscriptions</tspan></text></g>
<!-- single database --><g><path d="M1030 390C1030 370 1110 358 1220 358S1410 370 1410 390V720C1410 740 1330 752 1220 752S1030 740 1030 720Z" class="node store"/><ellipse cx="1220" cy="390" rx="190" ry="28" fill="#fff5cc" stroke="#46545e" stroke-width="3"/><text x="1220" y="460" class="dt"><tspan x="1220">D1 Rate My Creator</tspan><tspan x="1220" dy="28">Database</tspan></text><line x1="1080" y1="510" x2="1360" y2="510" stroke="#d2bc70" stroke-width="2"/><text x="1220" y="552" class="ds"><tspan x="1220">User accounts and profiles</tspan><tspan x="1220" dy="34">Creator information</tspan><tspan x="1220" dy="34">Reviews and votes</tspan><tspan x="1220" dy="34">Follows and connections</tspan></text></g>
<!-- user flows --><path d="M280 560H320V287H430" class="flow"/><rect x="285" y="245" width="180" height="29" rx="5" class="pill"/><text x="375" y="265" class="label">Sign-in/profile details</text><path d="M280 580H430" class="flow"/><rect x="285" y="540" width="145" height="29" rx="5" class="pill"/><text x="357" y="560" class="label">Creator search</text><path d="M280 605H330V667H430" class="flow"/><rect x="284" y="631" width="182" height="29" rx="5" class="pill"/><text x="375" y="651" class="label">Review, rating, or vote</text><path d="M280 630H310V857H430" class="flow"/><rect x="283" y="815" width="184" height="29" rx="5" class="pill"/><text x="375" y="835" class="label">Follow/import choice</text><path d="M430 327H400V520H280" class="response"/><rect x="284" y="480" width="166" height="29" rx="5" class="pill"/><text x="367" y="500" class="label">Account confirmation</text><path d="M430 515H400V545H280" class="response"/><rect x="283" y="572" width="174" height="29" rx="5" class="pill"/><text x="370" y="592" class="label">Creator information</text><path d="M430 705H390V655H280" class="response"/><rect x="284" y="718" width="170" height="29" rx="5" class="pill"/><text x="369" y="738" class="label">Reviews and totals</text><path d="M430 895H370V680H280" class="response"/><rect x="283" y="940" width="180" height="29" rx="5" class="pill"/><text x="373" y="960" class="label">Follow/import results</text>
<!-- process/database flows --><path d="M755 275H900V420H1030" class="flow"/><rect x="790" y="238" width="140" height="29" rx="5" class="pill"/><text x="860" y="258" class="label">Profile update</text><path d="M1030 455H880V325H755" class="response"/><rect x="792" y="332" width="136" height="29" rx="5" class="pill"/><text x="860" y="352" class="label">Profile record</text><path d="M755 465H1030" class="flow"/><rect x="812" y="427" width="160" height="29" rx="5" class="pill"/><text x="892" y="447" class="label">Creator request</text><path d="M1030 520H755" class="response"/><rect x="808" y="526" width="168" height="29" rx="5" class="pill"/><text x="892" y="546" class="label">Creator information</text><path d="M755 650H1030" class="flow"/><rect x="806" y="612" width="172" height="29" rx="5" class="pill"/><text x="892" y="632" class="label">Review or vote entry</text><path d="M1030 705H755" class="response"/><rect x="798" y="711" width="188" height="29" rx="5" class="pill"/><text x="892" y="731" class="label">Reviews and totals</text><path d="M755 835H950V735H1030" class="flow"/><rect x="798" y="794" width="190" height="29" rx="5" class="pill"/><text x="893" y="814" class="label">Follow/connection update</text><path d="M1030 730H980V885H755" class="response"/><rect x="807" y="890" width="170" height="29" rx="5" class="pill"/><text x="892" y="910" class="label">Saved follow records</text>
<!-- external APIs --><path d="M755 255H1610V260H1680" class="flow"/><rect x="1375" y="217" width="150" height="29" rx="5" class="pill"/><text x="1450" y="237" class="label">Sign-in request</text><path d="M1680 320H1610V365H755" class="response"/><rect x="1366" y="371" width="170" height="29" rx="5" class="pill"/><text x="1451" y="391" class="label">Verified identity</text><path d="M755 820H1580V895H1680" class="flow"/><rect x="1350" y="780" width="210" height="29" rx="5" class="pill"/><text x="1455" y="800" class="label">Subscription request</text><path d="M1680 955H1580V1005H755" class="response"/><rect x="1322" y="1011" width="270" height="29" rx="5" class="pill"/><text x="1457" y="1031" class="label">Subscription and channel details</text>
<text x="350" y="1135" class="sub">D1 represents one database containing several related tables—not separate databases.</text>
</svg>
